name: Bump tap on release

# Manual only: run by hand (Actions tab -> Bump tap on release -> Run
# workflow) after a release. Tap updates are intentionally not automated.
# The job pushes with this repo's own GITHUB_TOKEN (contents: write); this
# assumes the default branch accepts direct pushes from github-actions.
#
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, without a leading v (e.g. 0.2.0)"
        required: true
      source_sha256:
        description: "sha256 of the vVERSION source tarball (github.com/yadorilink/yadorilink/archive/refs/tags/vVERSION.tar.gz)"
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update Formula (url + sha256)
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "source_sha256 must be exactly 64 lowercase hex characters, got: $SHA256" >&2
            exit 1
          fi
          sed -i -E "s#^( +url )\"https://github.com/yadorilink/yadorilink/archive/refs/tags/v[^\"]*\"#\1\"https://github.com/yadorilink/yadorilink/archive/refs/tags/v${VERSION}.tar.gz\"#" Formula/yadorilink.rb
          sed -i -E "s/^( +sha256 )\"[0-9a-f]{64,}\"/\1\"${SHA256}\"/" Formula/yadorilink.rb

      - name: Verify Ruby syntax
        run: |
          ruby -c Formula/yadorilink.rb

      - name: Show diff
        run: git diff

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes -- Formula already at ${VERSION}."
            exit 0
          fi
          git config user.name "yadorilink-release-bot"
          git config user.email "actions@github.com"
          git add Formula/yadorilink.rb
          git commit -m "yadorilink ${VERSION}"
          git push
